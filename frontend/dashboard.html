<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant Dashboard</title>

    <link rel="stylesheet" href="dashboard.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

<div class="container">

    <div class="sidebar">

        <div class="logo">
            <i class="fa-solid fa-robot"></i>
            <h2>AI Assistant</h2>
        </div>

        <button class="menu-btn" id="newChatBtn">
            <i class="fa-solid fa-plus"></i>
            New Chat
        </button>

        <h3 class="menu-title">Chats</h3>

        <button class="menu-btn" id="searchChatBtn">
            <i class="fa-solid fa-magnifying-glass"></i>
            Search Chats
        </button>

        <button class="menu-btn" id="libraryBtn">
            <i class="fa-solid fa-book"></i>
            Library
        </button>

        <button class="menu-btn" id="appsBtn">
            <i class="fa-solid fa-table-cells"></i>
            Apps
        </button>

        <button class="menu-btn" id="deepSearchBtn">
            <i class="fa-solid fa-brain"></i>
            Deep Search
        </button>

        <button class="menu-btn" id="historyBtn">
            <i class="fa-solid fa-clock-rotate-left"></i>
            History
        </button>

        <button class="menu-btn" id="premiumBtn">
            <i class="fa-solid fa-crown"></i>
            Premium Plans
        </button>

        <button class="menu-btn" id="profileBtn">
            <i class="fa-solid fa-user"></i>
            User Profile
        </button>

        <button class="menu-btn" id="accountBtn">
            <i class="fa-solid fa-circle-user"></i>
            Account Menu
        </button>

        <button class="menu-btn" id="settingsBtn">
            <i class="fa-solid fa-gear"></i>
            Settings
        </button>

        <button class="menu-btn logout" id="logoutBtn">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </button>

    </div>

    <div class="main">

        <div class="header">
            <h1 id="welcomeText">Welcome Raj 👋</h1>
            <p>Your Personal AI Assistant</p>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="bot-message">
                Hello Raj 👋 <br>
                How can I help you today?
            </div>
        </div>

        <div class="input-area">
            <input
                type="text"
                id="message"
                placeholder="Ask Anything..."
                autocomplete="off">

            <button id="sendBtn">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>

    </div>

</div>

<script src="dashboard.js"></script>

</body>
</html>
